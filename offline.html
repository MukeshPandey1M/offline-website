<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>You're Offline</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-family: Arial;

            background: #f3f4f6;

            color: #111827;
        }

        .box {

            background: white;

            padding: 40px;

            border-radius: 18px;

            max-width: 500px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.08);
        }

        h1 {

            font-size: 35px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>📡 You're Offline</h1>

    <p>
        The internet connection is unavailable,
        but your offline website is still running.
    </p>

</div>

</body>

</html>
